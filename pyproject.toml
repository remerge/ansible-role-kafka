[project]
name = "ansible-role-kafka"
version = "0.0.0"
description = "Ansible Role for Kafka"
authors = [{ name = "Remerge GmbH", email = "core@remerge.io" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [
]

[dependency-groups]
dev = [
    "ruff==0.15.11",
    "ansible-lint==26.4.0 ; platform_system != 'Windows'",
    "ansible-dev-tools==26.4.5",
]
test = [
    "pytest==9.0.3",
]

[tool.uv]
package = false
default-groups = [
    "dev",
    "test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
