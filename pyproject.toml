[project]
name = "ansible-role-kafka"
version = "0.0.0"
description = "Ansible Role for Kafka"
authors = [{ name = "Remerge GmbH", email = "core@remerge.io" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
dependencies = [
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "ansible-lint==26.10.1 ; platform_system != 'Windows'",
    "ansible-dev-tools==26.10.0",
]
test = [
    "pytest==9.2.0",
]

[tool.uv]
package = false
default-groups = [
    "dev",
    "test",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
