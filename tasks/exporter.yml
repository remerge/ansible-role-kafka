---
# Downloads and unpacks only a version that is not in /opt yet. Check mode
# downloads nothing, so it reports a missing version as a change instead of
# unpacking an archive that is not there.
- name: Check whether Kafka exporter is unpacked
  ansible.builtin.stat:
    path: /opt/{{ kafka_exporter_archive }}
  register: kafka_exporter_unpacked

- name: Download Kafka exporter
  ansible.builtin.get_url:
    url: "{{ kafka_exporter_url }}"
    dest: /tmp/{{ kafka_exporter_archive }}.tar.gz
    checksum: "{{ kafka_exporter_checksum }}"
    mode: "0644"
  when: not kafka_exporter_unpacked.stat.exists

- name: Unarchive Kafka exporter
  ansible.builtin.unarchive:
    src: /tmp/{{ kafka_exporter_archive }}.tar.gz
    dest: /opt
    remote_src: true
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    creates: /opt/{{ kafka_exporter_archive }}
  notify:
    - Restart Kafka exporter
  when:
    - not kafka_exporter_unpacked.stat.exists
    - not ansible_check_mode

- name: Report the Kafka exporter install in check mode
  ansible.builtin.debug:
    msg: Check mode would download and unpack /opt/{{ kafka_exporter_archive }}.
  changed_when: true
  when:
    - not kafka_exporter_unpacked.stat.exists
    - ansible_check_mode
  notify:
    - Restart Kafka exporter

- name: Create Kafka exporter symlink
  ansible.builtin.file:
    src: /opt/{{ kafka_exporter_archive }}
    dest: /opt/kafka_exporter
    owner: "{{ kafka_user }}"
    group: "{{ kafka_group }}"
    state: link
  notify:
    - Restart Kafka exporter
  # The link target does not exist in check mode until the version is unpacked.
  when: kafka_exporter_unpacked.stat.exists or not ansible_check_mode

- name: Copy Kafka systemd service
  ansible.builtin.template:
    src: kafka-exporter.service.j2
    dest: /usr/lib/systemd/system/kafka-exporter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Kafka exporter

- name: Flush handlers to prevent restart after start
  ansible.builtin.meta: flush_handlers

- name: Start Kafka exporter
  ansible.builtin.systemd:
    name: kafka-exporter
    state: started
    daemon_reload: true
    enabled: true
