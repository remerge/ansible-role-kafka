---
scala_version: "2.13"
kafka_version: "4.4.0"
kafka_archive: "kafka_{{ scala_version }}-{{ kafka_version }}"
kafka_checksum: "sha512:f5ceba8a265ab6bb2d68362b1f6859a95e15d60ef92ba83b43fdf065b557dc18e98d6383c15b9977320e25b3a2c8b6f11decb17b0fa6c0f163423793a0eb95cb"
kafka_url: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/{{ kafka_archive }}.tgz"

jmx_exporter_version: "1.7.0"
jmx_exporter_archive: "jmx_prometheus_javaagent-{{ jmx_exporter_version }}"
jmx_exporter_checksum: "sha512:7322be2ffd6c0d418622cd48a4dbd9fcd62eca7d163e4ff02992fdd907c1e2dc7dc330e7dd15548d755330c9c512773a8c0f89f9b6bb2b8826ecf6c539f25e0c"
jmx_exporter_url: "https://github.com/prometheus/jmx_exporter/releases/download/{{ jmx_exporter_version }}/{{ jmx_exporter_archive }}.jar"

kafka_exporter_version: "1.11.0"
kafka_exporter_archive: "kafka_exporter-{{ kafka_exporter_version }}.linux-amd64"
kafka_exporter_checksum: "sha512:8836e92827132dd232010a1c53fc7e3a815b4c9e47b8b5791957c43ad1a839035482ea69aca42891e626b6a96bcd791cc863cc64315ce519d0ea4604090a3a93"
kafka_exporter_url: "https://github.com/danielqsj/kafka_exporter/releases/download/v{{ kafka_exporter_version }}/{{ kafka_exporter_archive }}.tar.gz"

kafka_user: kafka
kafka_group: kafka

kafka_process_roles:
  - broker
  - controller

kafka_listener_address: "{{ ansible_facts['default_ipv4']['address'] }}"
kafka_node_id: "{{ kafka_listener_address | ansible.utils.ipaddr('int') }}"
